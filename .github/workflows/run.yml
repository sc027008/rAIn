name: Rain Alert Runner

on:
  # GAS（Google Apps Script）等からの外部APIリクエストによる手動/自動起動のみに一本化
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rain:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # ★ pip パッケージ（pandas等）のキャッシュを有効化

      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # ★ npm パッケージのキャッシュを有効化

      - name: Node.js 依存ライブラリのインストール & Lockファイル自動生成
        run: |
          if [ ! -f package-lock.json ]; then
            npm install
            git config --local user.name "github-actions[bot]"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Chore: Add package-lock.json [skip ci]" || true
            git pull origin main --rebase || true
            git push || true
          else
            npm ci || npm install
          fi

      - name: 必要なライブラリのインストール
        run: |
          pip install -r requirements.txt

      - name: 雨量チェックプログラムの実行
        env:
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          TEST_CHAT_WEBHOOK_URL: ${{ secrets.TEST_CHAT_WEBHOOK_URL }} # ★ テスト環境用送信先
          TARGET_LAT: ${{ secrets.TARGET_LAT }}
          TARGET_LON: ${{ secrets.TARGET_LON }}
          ACTIVATED_SLUDGE_URL: ${{ secrets.ACTIVATED_SLUDGE_URL }}
        run: |
          python main.py

      - name: 残余状態(state.json)の更新保存
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if git status --porcelain | grep -q "state.json"; then
            git commit -m "Chore: Update state.json [skip ci]"
            
            # HTTP/2 CANCEL エラー(Exit 128)防止のためバッファを拡張
            git config --local http.postBuffer 524288000
            
            # 同時実行の競合(Exit 1)対策のリトライループ（最大3回）
            success=false
            for i in {1..3}; do
              if git pull origin main --rebase && git push; then
                success=true
                echo "Push 成功 ($i 回目の試行)"
                break
              fi
              echo "Push 失敗 ($i/3)。5秒後にリトライします..."
              sleep 5
            done
            
            if [ "$success" = false ]; then
              echo "エラー: 3回のリトライ後も Push に失敗しました。"
              exit 1
            fi
          fi
