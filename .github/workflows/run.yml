name: Rain Alert Runner

on:
  # GAS（Google Apps Script）等からの外部APIリクエストによる手動/自動起動のみに一本化
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rain:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests Pillow pandas jpholiday

      - name: 雨量チェックプログラムの実行
        env:
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          TARGET_LAT: ${{ secrets.TARGET_LAT }}
          TARGET_LON: ${{ secrets.TARGET_LON }}
        run: |
          python main.py

      - name: 状態(state.json)の更新保存
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          if git status --porcelain | grep -q "state.json"; then
            git add state.json
            git commit -m "Chore: Update state.json [skip ci]"
            git push
          else
            echo "state.json に変更はありません。"
          fi
