name: Rain Alert Runner

on:
  schedule:
    # 5分おきに自動実行
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-rain:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests pillow jpholiday

      - name: 雨量チェックプログラムの実行
        env:
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          TARGET_LAT: ${{ secrets.TARGET_LAT }}
          TARGET_LON: ${{ secrets.TARGET_LON }}
        run: python main.py

      - name: 状態(state.json)の更新保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update rain state [skip ci]" && git push)
