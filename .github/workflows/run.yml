name: Rain Alert Runner

on:
  schedule:
    # 5分おきに自動実行（UTC表記）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手動実行ボタンの有効化

jobs:
  check-rain:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests pillow

      - name: 雨量チェックプログラムの実行
        env:
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          TARGET_LAT: ${{ secrets.TARGET_LAT }}
          TARGET_LON: ${{ secrets.TARGET_LON }}
        run: python main.py
