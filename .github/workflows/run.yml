name: Rain Alert Runner

on:
  # GAS（Google Apps Script）等からの外部APIリクエストによる手動/自動起動のみに一本化
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rain:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'

      - name: フォント（LINE Seed JP & Noto Sans）の確実な自動インストール
        run: |
          sudo apt-get update && sudo apt-get install -y curl
          
          sudo mkdir -p /usr/share/fonts/truetype/line-seed
          sudo mkdir -p /usr/share/fonts/truetype/noto

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

          # 1. LINE Seed JP (700)
          URL_LINE=$(curl -s -A "$UA" "https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@700&display=swap" | grep -o "src: url([^)]*)" | sed -E "s/src: url\(['\"]?([^'\"]+)['\"]?\)/\1/")
          echo "LINE Seed JP URL: $URL_LINE"
          sudo curl -sS -L -o /usr/share/fonts/truetype/line-seed/LINESeedJP-Bold.ttf "$URL_LINE"

          # 2. Noto Sans (400)
          URL_NOTO_REG=$(curl -s -A "$UA" "https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400&display=swap" | grep -o "src: url([^)]*)" | sed -E "s/src: url\(['\"]?([^'\"]+)['\"]?\)/\1/")
          echo "Noto Sans Regular URL: $URL_NOTO_REG"
          sudo curl -sS -L -o /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf "$URL_NOTO_REG"

          # 3. Noto Sans (700)
          URL_NOTO_BOLD=$(curl -s -A "$UA" "https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700&display=swap" | grep -o "src: url([^)]*)" | sed -E "s/src: url\(['\"]?([^'\"]+)['\"]?\)/\1/")
          echo "Noto Sans Bold URL: $URL_NOTO_BOLD"
          sudo curl -sS -L -o /usr/share/fonts/truetype/noto/NotoSans-Bold.ttf "$URL_NOTO_BOLD"

          sudo fc-cache -fv

      - name: Node.js 依存ライブラリのインストール
        run: |
          npm ci || npm install

      - name: 必要なライブラリのインストール
        run: |
          pip install requests Pillow pandas jpholiday

      - name: 雨量チェックプログラムの実行
        env:
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          TARGET_LAT: ${{ secrets.TARGET_LAT }}
          TARGET_LON: ${{ secrets.TARGET_LON }}
        run: |
          python main.py

      - name: 状態(state.json)および生成画像の更新保存
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # state.json または charts/ ディレクトリ内に変更があればコミット
          git add state.json charts/ 2>/dev/null || true
          if git status --porcelain | grep -qE "state.json|charts/"; then
            git commit -m "Chore: Update state.json and generated charts [skip ci]"
            git push
          else
            echo "state.json に変更はありません。"
          fi
